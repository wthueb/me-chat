[package]
name = "gap-check"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.6"
chrono = "0.4"
chrono-tz = "0.10"
color-eyre = "0.6"
crabstep = "0.3"
dotenvy = "0.15.7"
futures = "0.3.32"
indicatif = "0.18"
regex = "1.12"
serde = "1"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tabled = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
hex = "0.4.3"

[profile.dev.package.backtrace]
opt-level = 3
