[package]
name = "me-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.6"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive"] }
color-eyre = "0.6"
dotenvy = "0.15"
imessage-database = "4.0"
indicatif = "0.18"
ouroboros = "0.18"
regex = "1.12"
rusqlite = "0.39"
serde = "1.0"
serde_json = "1.0"
tabled = "0.20"

[dev-dependencies]
hex = "0.4"

[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
debug = true
